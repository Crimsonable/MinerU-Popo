services:
  mineru-popo-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: mineru-popo-service:latest
    container_name: mineru-popo-service
    restart: unless-stopped
    depends_on:
      - popo-vllm
    ports:
      - "9000:9000"
    environment:
      # MinerU OCR service. This service calls ${MINERU_FILE_PARSE_URL} and
      # requests only middle_json from MinerU's /file_parse response.
      MINERU_FILE_PARSE_URL: ${MINERU_FILE_PARSE_URL:-http://host.docker.internal:8888/file_parse}
      MINERU_TIMEOUT: ${MINERU_TIMEOUT:-600}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_PARSE_METHOD: ${MINERU_PARSE_METHOD:-auto}
      MINERU_LANG: ${MINERU_LANG:-ch}

      # Popo vLLM OpenAI-compatible endpoint. The default points to the
      # popo-vllm service in this compose stack.
      POPO_VLLM_BASE_URL: ${POPO_VLLM_BASE_URL:-http://popo-vllm:8000/v1}
      POPO_VLLM_API_KEY: ${POPO_VLLM_API_KEY:-EMPTY}
      POPO_VLLM_MODEL: ${POPO_VLLM_MODEL:-Popo}
      POPO_TIMEOUT: ${POPO_TIMEOUT:-300}
      POPO_MAX_TOKENS: ${POPO_MAX_TOKENS:-8192}
      POPO_TEMPERATURE: ${POPO_TEMPERATURE:-0}
      POPO_MAX_PROMPT_CHARS: ${POPO_MAX_PROMPT_CHARS:-100000}

      SERVICE_MAX_POPO_CONCURRENCY: ${SERVICE_MAX_POPO_CONCURRENCY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  popo-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: popo-vllm
    restart: unless-stopped
    shm_size: ${VLLM_SHM_SIZE:-16gb}
    ports:
      - "${VLLM_HOST_PORT:-8000}:8000"
    environment:
      CUDA_VISIBLE_DEVICES: ${VLLM_GPU_DEVICE_IDS:-0}
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GPU_DEVICE_IDS:-0}
    volumes:
      - ${POPO_MODEL_HOST_PATH:-./models/MinerU-Popo}:${POPO_MODEL_CONTAINER_PATH:-/models/MinerU-Popo}:ro
      - ${HF_CACHE_HOST_PATH:-./.cache/huggingface}:/root/.cache/huggingface
    command: >
      --model ${POPO_MODEL_CONTAINER_PATH:-/models/MinerU-Popo}
      --host 0.0.0.0
      --port 8000
      --served-model-name ${POPO_VLLM_MODEL:-Popo}
      --dtype ${POPO_VLLM_DTYPE:-bfloat16}
      --max-model-len ${POPO_MAX_MODEL_LEN:-32768}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
